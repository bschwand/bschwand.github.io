message: "I really enjoyed your article on \"The Ultimate 3D Printer Z Probe.\" The idea of weighing the print during the process is fascinating and one I haven’t come across before.\r\n\r\nHowever, there’s an important aspect I’d like to highlight: under-bed sensors can sometimes face serious issues due to the dynamic behavior of the bed itself. Additionally, sensor mismatches can contribute to complications. I want to clarify that I don’t anticipate any problems with strain gauge sensors on a delta printer with a heavy bed. But if you're using a lighter square bed, like those found on bed slingers, it could present challenges.\r\n\r\nThe core of the issue arises when the nozzle makes contact with the bed, transmitting a transverse (up and down) pressure wave to the sensors. Under certain conditions, this wave may reflect off the edges and corners, and occasionally, these reflections can cancel each other out.\r\n\r\nI initiated a discussion on this topic over on https://reprap.org/forum/read.php?424,865620. In my own setups, I utilize a single under-bed piezo sensor to determine the nozzle contact position—essentially acting as a Z stop—paired with a touch sensor for bed mapping. You can check them out at https://www.youtube.com/watch?v=DQXM4nrcsr4 and https://www.youtube.com/watch?v=waXIr_ytukw. My touch sensors are custom designed, having a sensitivity of under 1 gram and a repeatability within 2 microns."
